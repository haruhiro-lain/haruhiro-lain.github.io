# ============================================================
# NAS Docker 部署配置（Synology Container Manager / 群晖）
# ============================================================
# 使用方法：
#   1. 先在开发机上构建镜像并推送到仓库：
#      docker build -t your-registry/astro-blog:latest -f docker/Dockerfile .
#      docker push your-registry/astro-blog:latest
#
#   2. 在 NAS 的 Container Manager 中：
#      "项目" → "新增" → 粘贴本文件内容 → 下一步 → 完成
#
#   3. 访问 http://<NAS-IP>:18080
# ============================================================

services:
  astro-blog:
    image:  haruhirolain/astro-blog:latest
    container_name: astro-blog
    ports:
      - "18080:80"
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================
# 备选方案：如果 NAS 能访问源码，可直接构建（替换上面 image 部分）

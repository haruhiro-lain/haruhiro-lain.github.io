server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 文件描述符缓存（减少 NAS 磁盘 I/O）
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip 压缩 — 静态博客压缩后体积减少 70%+
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 字体和图片缓存
    location ~* \.(woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML 页面（允许 CDN 缓存）
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, s-maxage=3600";
    }

    # 主路由
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
